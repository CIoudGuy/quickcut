[package]
name = "qcut-wasm"
description = "QuickCut .qcut tile codec (PRED+ANS) for the browser: no dependencies, safe Rust"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# its own workspace (the quickcut root workspace must not claim it)
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
