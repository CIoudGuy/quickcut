<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#161617">
  <meta name="description" content="Cut videos, crop photos and pick colors in your browser. Fast, free, nothing uploaded.">
  <title>QuickCut</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%232F6FEB'/%3E%3Cpath d='M9 7v10l8-5z' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="shared/fonts/Inter-Medium.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="shared/fonts/Inter-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="shared/tokens.css">
  <link rel="stylesheet" href="shared/ui.css">
  <link rel="stylesheet" href="shell.css">
  <script src="shared/boot.js"></script>
</head>
<body>
  <nav class="top" aria-label="Tools">
    <div class="zoom" role="group" aria-label="Interface size (Ctrl + / − / 0)">
      <button class="z-btn" type="button" data-z="-1" aria-label="Smaller interface (Ctrl −)"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M3.5 8h9"/></svg></button>
      <button class="z-val" type="button" id="zoom-value" title="Reset size (Ctrl 0)">110%</button>
      <button class="z-btn" type="button" data-z="1" aria-label="Larger interface (Ctrl +)"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M3.5 8h9M8 3.5v9"/></svg></button>
    </div>
    <div class="tabs" role="tablist" aria-label="Tool">
      <span class="pill" aria-hidden="true"></span>
      <button class="tab" role="tab" id="tab-photo" data-tool="photo" aria-controls="view-photo" title="Photo (Alt 1)">Photo</button>
      <button class="tab" role="tab" id="tab-video" data-tool="video" aria-controls="view-video" title="Video (Alt 2)">Video</button>
      <button class="tab" role="tab" id="tab-color" data-tool="color" aria-controls="view-color" title="Color Picker (Alt 3)">Color Picker</button>
    </div>
    <a class="credit" href="https://github.com/CIoudGuy/quickcut" target="_blank" rel="noopener" title="QuickCut on GitHub"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.5 4.5L2 8l3.5 3.5M10.5 4.5L14 8l-3.5 3.5"/></svg><span>Open source</span></a>
  </nav>
  <main class="views">
    <section class="view" id="view-photo" role="tabpanel" aria-labelledby="tab-photo" hidden></section>
    <section class="view" id="view-video" role="tabpanel" aria-labelledby="tab-video" hidden></section>
    <section class="view" id="view-color" role="tabpanel" aria-labelledby="tab-color" hidden></section>
  </main>
  <script type="module" src="shell.js"></script>
</body>
</html>
